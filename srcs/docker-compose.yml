services:
  mariadb:
    image: inception-mariadb:1.0
    build:
      context: ./requirements/mariadb
    container_name: mariadb
    restart: on-failure
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
  
  wordpress:
    build:
      context: ./requirements/wordpress
    container_name: wordpress
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  nginx:
    build:
      context: ./requirements/wordpress
    container_name: nginx
    restart: on-failure
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html/:ro
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mdaghouj/data/mariadb

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mdaghouj/data/wordpress
